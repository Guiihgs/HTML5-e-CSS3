<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Output</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
            <fieldset>
                <legend>Primeiro Exemplo</legend>
                <p>
                    <label for="in1">Número 1: </label>
                    <input type="number" name="n1" id="in1" min="0" max="50" required
                    oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
                </p>
                <p>
                    <label for="in2">Númeto 2:</label>
                    <input type="number" name="n2" id="in2" min="0" max="50" required
                    oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
                </p>
                <p>
                    <label for="isoma">Resultado da Soma: </label>
                    <output name="soma" id="isoma">0</output>
                </p>
            </fieldset>

            <fieldset>
                <legend>Segundo Exemplo</legend>
                <p>
                    <label for="inum">Satisfação Geral: </label>
                    <input type="range" name="num" id="inum" min="1" max="10" value="5"
                    oninput="ival.innerHTML = Number(inum.value)">
                    <output name="val" id="ival">5</output>
                </p>
            </fieldset>

            <fieldset>
                <legend>Terceiro Exemplo</legend>
                <p>
                    <label for="iano">Em que ano você nasceu?</label>
                    <input type="number" name="ano" id="iano" min="1900" max="2026" value="2000"
                    oninput="idade.innerHTML = Number(2026) - Number(iano.value)">
                </p>
                <p>
                    <label for="idade">Idade Atual: </label>
                    <output id="idade">26</output>
                </p>
            </fieldset>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
    </form>
</body>
</html>
